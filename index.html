<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Normal Combat</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0d12; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; image-rendering: pixelated; background: #000; }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540" tabindex="0"></canvas>
  <script src="js/characters.js"></script>
  <script src="js/game.js"></script>
  <script>document.getElementById('game').focus();</script>
</body>
</html>
